apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-nfs-server
  labels: {app: e2e-nfs-server}
spec:
  replicas: 1
  selector: {matchLabels: {app: e2e-nfs-server}}
  template:
    metadata:
      labels: {app: e2e-nfs-server}
    spec:
      containers:
      - name: nfs-server
        image: e2e-nfs-server:v0.1.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        ports:
        - {name: nfs, containerPort: 2049}
        - {name: rpcbind, containerPort: 111}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-svc
spec:
  selector: {app: e2e-nfs-server}
  ports:
  - {name: nfs, port: 2049}
  - {name: rpcbind, port: 111}

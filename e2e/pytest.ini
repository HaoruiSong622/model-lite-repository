[pytest]
markers =
    contract: API contract tests (single endpoint, sync, no async)
    e2e: end-to-end flow tests (multi-step, async, artifact verification)
    slow: state machine edge cases and long-running paths
    cifs_skip: CIFS source tests (skipped pending app SYS_ADMIN capability)
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers

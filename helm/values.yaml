# Default values for model-lite-repository
# This is a YAML-formatted file.

# -- Number of replicas
replicaCount: 1

image:
  # -- Container image repository (build locally or set to your registry)
  repository: model-lite-repository
  # -- Pull policy: Always for SNAPSHOT, IfNotPresent for tagged releases
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""

# -- Image pull secrets (for private registries)
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Create Role and RoleBinding granting the ServiceAccount permissions to manage
# upload Jobs, ConfigMaps, Secrets, Pods and pod logs in this namespace.
# Required for Fabric8K8sJobService (weight upload feature) to operate.
rbac:
  create: true

# -- Schema migration init container (runs before app starts).
# Waits for PostgreSQL to be ready, then drops+recreates the schema by applying
# the SQL files bundled in the sql-configmap. Idempotent on every pod restart.
initContainers:
  dbMigrate:
    enabled: true
    image:
      repository: postgres
      tag: "15"
      pullPolicy: IfNotPresent

# -- Shared weight storage PVC. The application hardcodes the PVC name as
# "model-weights" (see UploadApplicationService / TaskReconciler), so the PVC
# name MUST stay "model-weights" unless the application code is also changed.
# Uses hostPath for dev/test environments; switch to a networked storage class
# (NFS, CephFS, etc.) for multi-node production clusters.
weightStorage:
  enabled: true
  pvcName: "model-weights"
  mountPath: /data/weights
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClassName: ""
  reclaimPolicy: Retain
  hostPath: /tmp/modellite-weights

# -- Annotations to add to the deployment
podAnnotations: {}

# -- Pod security context
podSecurityContext: {}

# -- Container security context
securityContext: {}

service:
  # -- Service type (ClusterIP for internal, NodePort/LoadBalancer for external access)
  type: ClusterIP
  # -- Service port
  port: 8080
  # -- NodePort (only used when service.type is NodePort)
  nodePort: null

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  hosts:
    - host: model-lite-repository.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  # -- Container resource limits
  limits:
    cpu: 1000m
    memory: 1Gi
  # -- Container resource requests
  requests:
    cpu: 250m
    memory: 512Mi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Application configuration (passed as environment variables)
app:
  # -- Spring profiles to activate (e.g., "dev,k8s")
  profiles: "dev"
  # -- Server port inside container
  serverPort: 8080
  # -- Logging level
  logLevel: "INFO"

# -- PostgreSQL database configuration
database:
  # -- Database host (auto-set to bundled PostgreSQL service name when postgresql.enabled=true)
  host: ""
  # -- Database port
  port: 5432
  # -- Database name
  name: "modellite"
  # -- Database username
  username: "modellite"
  # -- Database password (or use existingSecret)
  password: "changeme"
  # -- Use an existing Kubernetes Secret for credentials (keys: username, password)
  existingSecret: ""

# -- Bundled PostgreSQL database (set enabled=false to use external database)
postgresql:
  # -- Enable bundled PostgreSQL Deployment
  enabled: true
  image:
    # -- PostgreSQL image repository (official image supports arm64)
    repository: postgres
    # -- PostgreSQL image tag
    tag: "15"
    # -- Image pull policy
    pullPolicy: IfNotPresent
  # -- Additional environment variables for PostgreSQL
  extraEnv: []
  persistence:
    # -- SubPath within the volume for data
    subPath: postgres
    # -- hostPath on the node for data storage (debug/dev only)
    hostPath: "/tmp/postgresql-data"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Weight import job configuration (file-copier)
weightImport:
  job:
    image: "modellite/file-copier:latest"
    namespace: ""

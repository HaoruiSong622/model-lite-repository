apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-lite-repository.fullname" . }}
  labels:
    {{- include "model-lite-repository.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "model-lite-repository.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "model-lite-repository.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "model-lite-repository.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.dbMigrate.enabled }}
      initContainers:
        - name: db-migrate
          image: "{{ .Values.initContainers.dbMigrate.image.repository }}:{{ .Values.initContainers.dbMigrate.image.tag }}"
          imagePullPolicy: {{ .Values.initContainers.dbMigrate.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ include "model-lite-repository.fullname" . }}-postgresql
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: username
              {{- else }}
              value: {{ .Values.database.username | quote }}
              {{- end }}
            - name: PGPASSWORD
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-lite-repository.fullname" . }}-db
                  key: password
              {{- end }}
          command: ['/bin/sh', '-c']
          args:
            - |
              set -e
              echo "Waiting for PostgreSQL at $PGHOST:$PGPORT..."
              until pg_isready -q; do
                echo "  PostgreSQL not ready, retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready."
              echo "Resetting schema (drop existing tables)..."
              psql -v ON_ERROR_STOP=1 <<'EOSQL'
              DROP TABLE IF EXISTS model_tag, model_type_tag, version_lock, convert_task, upload_task, model_version, model, tag, model_type, category CASCADE;
              EOSQL
              echo "Applying schema files in order..."
              for f in \
                /sql/V1__create_core_tables.sql \
                /sql/V2__add_model_version_storage_columns.sql \
                /sql/V3__add_upload_task_version_column.sql \
                /sql/V1__builtin_data.sql; do
                echo "=== Running $f ==="
                psql -v ON_ERROR_STOP=1 -f "$f"
              done
              echo "Schema initialization complete."
          volumeMounts:
            - name: sql-scripts
              mountPath: /sql
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.serverPort }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.app.profiles | quote }}
            - name: SERVER_PORT
              value: {{ .Values.app.serverPort | quote }}
            - name: LOGGING_LEVEL_ROOT
              value: {{ .Values.app.logLevel | quote }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ if .Values.postgresql.enabled }}{{ include "model-lite-repository.fullname" . }}-postgresql{{ else }}{{ .Values.database.host }}{{ end }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: username
              {{- else }}
              value: {{ .Values.database.username | quote }}
              {{- end }}
            - name: SPRING_DATASOURCE_PASSWORD
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-lite-repository.fullname" . }}-db
                  key: password
              {{- end }}
            - name: WEIGHT_IMPORT_JOB_NAMESPACE
              value: {{ .Values.weightImport.job.namespace | default .Release.Namespace | quote }}
            - name: WEIGHT_IMPORT_JOB_IMAGE
              value: {{ .Values.weightImport.job.image | quote }}
            - name: TASK_RECONCILER_TERMINAL_CLEANUP_AGE_MS
              value: "10000"
            {{- if .Values.weightStorage.enabled }}
            - name: WEIGHT_STORAGE_PATH
              value: {{ .Values.weightStorage.mountPath | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.weightStorage.enabled }}
          volumeMounts:
            - name: weight-storage
              mountPath: {{ .Values.weightStorage.mountPath | quote }}
          {{- end }}
      volumes:
        {{- if .Values.initContainers.dbMigrate.enabled }}
        - name: sql-scripts
          configMap:
            name: {{ include "model-lite-repository.fullname" . }}-sql
        {{- end }}
        {{- if .Values.weightStorage.enabled }}
        - name: weight-storage
          persistentVolumeClaim:
            claimName: {{ .Values.weightStorage.pvcName | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "model-lite-repository.fullname" . }}-sql
  labels:
    {{- include "model-lite-repository.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "sql/**" }}
  {{ base $path }}: |-
{{- $.Files.Get $path | nindent 4 }}
{{- end }}
